# This is an open API description (OAD), it describes an HTTP-like API
openapi: "3.0.3"
info:
  title: "Porygon REST API"
  version: "0.1.0"
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local development
components:
  securitySchemes:
    JwtBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito-issued access token in the Authorization header
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    NullableId:
      type: integer
      format: int64
      minimum: 1
      nullable: true
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        invalid_params:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string
    Deck:
      type: object
      description: archetype_id is null when no archetype is assigned
      required: [id, name, created_at, archetype_id, notes]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        created_at:
          type: string
          format: date-time
        archetype_id:
          $ref: '#/components/schemas/NullableId'
        notes:
          type: string
    DeckInput:
      type: object
      description: archetype_id is null when no archetype is assigned
      required: [name, archetype_id, notes]
      properties:
        name:
          type: string
          minLength: 1
        archetype_id:
          $ref: '#/components/schemas/NullableId'
        notes:
          type: string
    DeckVersion:
      type: object
      required: [id, deck_id, name, created_at, cards, notes, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        deck_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        created_at:
          type: string
          format: date-time
        cards:
          type: string
        notes:
          type: string
        updated_at:
          type: string
          format: date-time
    DeckVersionInput:
      type: object
      required: [name, cards, notes]
      properties:
        name:
          type: string
          minLength: 1
        cards:
          type: string
        notes:
          type: string
    Archetype:
      type: object
      description: archetype_icon_id and/or archetype_icon2_id is null when no archetype icon is assigned
      required: [id, name, archetype_icon_id, archetype_icon2_id]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        archetype_icon_id:
          $ref: '#/components/schemas/NullableId'
        archetype_icon2_id:
          $ref: '#/components/schemas/NullableId'
    ArchetypeInput:
      type: object
      description: archetype_icon_id and/or `archetype_icon2_id` is null when no archetype icon is assigned
      required: [name, archetype_icon_id, archetype_icon2_id]
      properties:
        name:
          type: string
          minLength: 1
        archetype_icon_id:
          $ref: '#/components/schemas/NullableId'
        archetype_icon2_id:
          $ref: '#/components/schemas/NullableId'
    ArchetypeIcon:
      type: object
      required: [id, name, image_url]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        image_url:
          type: string
          format: uri
  parameters:
    DeckId:
      name: deck_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DeckVersionId:
      name: deck_version_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ArchetypeId:
      name: archetype_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest: #400
      description: Request is unrecognized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized: #401
      description: Caller is unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound: #404
      description: Resource is not found or not owned by the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict: #409
      description: Content does not meet unique constraint
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity: #422
      description: Resource is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnexpectedError: #500
      description: Unexpected error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
security:
  - JwtBearerAuth: []
paths:
  /decks:
    get:
      summary: Gets all decks for user
      operationId: listDecks
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: [decks]
                properties:
                  decks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Add a new deck
      operationId: createDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckInput'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        'default':
          $ref: '#/components/responses/UnexpectedError'
  /decks/{deck_id}:
    parameters:
    - $ref: '#/components/parameters/DeckId'
    get:
      summary: Gets a deck
      operationId: getDeck
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    put:
      summary: Replaces a deck
      operationId: replaceDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckInput'
      responses:
        '200':
          description: 'Replaced'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Deletes a deck
      operationId: deleteDeck
      responses:
        '204':
          description: 'No Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/UnexpectedError'
  /decks/{deck_id}/deck-versions:
    parameters:
    - $ref: '#/components/parameters/DeckId'
    get:
      summary: Gets all deck versions for deck
      operationId: listDeckVersions
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: [deck_versions]
                properties:
                  deck_versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeckVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create a deck version
      operationId: createDeckVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckVersionInput'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/UnexpectedError'
  /deck-versions/{deck_version_id}:
    parameters:
    - $ref: '#/components/parameters/DeckVersionId'
    get:
      summary: Get a deck version
      operationId: getDeckVersion
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    put:
      summary: Replaces a deck version
      operationId: replaceDeckVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckVersionInput'
      responses:
        '200':
          description: 'Replaced'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Deletes a deck version
      operationId: deleteDeckVersion
      responses:
        '204':
          description: 'No Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/UnexpectedError'
  /archetypes:
    get:
      summary: Gets all archetypes for user
      operationId: listArchetypes
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: [archetypes]
                properties:
                  archetypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Archetype'
        '401':
          $ref: '#/components/responses/Unauthorized'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    post:
      summary: Create an archetype
      operationId: createArchetype
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchetypeInput'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archetype'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        'default':
          $ref: '#/components/responses/UnexpectedError'
  /archetypes/{archetype_id}:
    parameters:
    - $ref: '#/components/parameters/ArchetypeId'
    put:
      summary: Replaces an archetype
      operationId: replaceArchetype
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchetypeInput'
      responses:
        '200':
          description: 'Replaced'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archetype'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        'default':
          $ref: '#/components/responses/UnexpectedError'
    delete:
      summary: Deletes an archetype
      operationId: deleteArchetype
      responses:
        '204':
          description: 'No Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        'default':
          $ref: '#/components/responses/UnexpectedError'
  /archetype-icons:
    get:
      summary: Get all archetype icons
      operationId: listArchetypeIcons
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                required: [archetype_icons]
                properties:
                  archetype_icons:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArchetypeIcon'
        '401':
          $ref: '#/components/responses/Unauthorized'
        'default':
          $ref: '#/components/responses/UnexpectedError'
